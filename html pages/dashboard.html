<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFFCF2]">
  <div class="w-full bg-[#403D39] p-6 flex justify-between items-center text-[#FFFCF2]">
    <div class="flex items-center">
      <div class="ml-16 rounded-lg text-white font-semibold  text-xl"><a href="">Home</a></div>
      <div class="ml-10 bg-[#EB5E28] py-2 px-4 rounded-lg text-white font-semibold  text-lg"><a href="">Dashboard</a></div>
    </div>

    <div class="flex items-center">
      <img src="../public/imgs/nu logo.png" alt="Nu logo" class="w-20 h-10 object-cover mr-2">
      <div class="font-bold pr-10 text-2xl">NU AUCTION SYSTEM</div>
    </div>
  </div>

  <div class="bg-[#CCC5B9]/50 border-4 border-[#EB5E28]/50 rounded-lg my-16 mx-48 h-4/6 flex flex-wrap gap-6 p-10">
      <button class="w-80 h-25 bg-[#403D39] text-[#FFFCF2] rounded-lg font-semibold text-3xl">Add Users</button>
      <button class="w-80 h-25 bg-[#403D39] text-[#FFFCF2] rounded-lg font-semibold text-3xl">Manage Users</button>
      <button class="w-80 h-25 bg-[#403D39] text-[#FFFCF2] rounded-lg font-semibold text-3xl">Change Host</button>
      <button class="w-80 h-25 bg-[#403D39] text-[#FFFCF2] rounded-lg font-semibold text-3xl">Set Auction Time</button>
      <button class="w-80 h-25 bg-[#403D39] text-[#FFFCF2] rounded-lg font-semibold text-3xl">Auction Picks</button>
  </div>
</body>
</html>
