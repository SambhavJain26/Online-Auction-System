<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Picks</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFFCF2]">
  <div class="w-full bg-[#403D39] p-6 flex justify-between items-center text-[#FFFCF2]">
    <div class="ml-10 bg-[#EB5E28] py-2 px-4 rounded-lg text-white font-semibold  text-lg"><a href="">Go back</a></div>
    <div class="flex items-center">
      <img src="../public/imgs/nu logo.png" alt="Nu logo" class="w-20 h-10 object-cover mr-2">
      <div class="font-bold pr-10 text-2xl">NU AUCTION SYSTEM</div>
    </div>
  </div>
  <div class="text-[#252422] grid grid-cols-1 justify-items-center my-10">
    <div class="text-4xl font-bold mb-3">Your Picks</div>
    <div class="text-lg font-semibold">Record of all the players you have bought</div>
  </div>
  <div class="flex justify-evenly mx-24 gap-10 mt-12">
      <!-- Card 1 -->
      <div class="grid grid-cols-1 justify-items-center bg-white h-96 w-full border-4 border-[#EB5E28]/50 rounded-lg p-6 shadow-2xl">
          <img src="../public/imgs/nupl.jpg" alt="NUPL Logo" class="object-cover rounded-lg w-full h-full shadow-2xl" />
          <button class="mt-4 w-full h-12 bg-[#403D39] text-[#FFFCF2] self-end rounded-lg font-semibold text-lg">See Players</button>
      </div>

      <!-- Card 2 -->
      <div class="grid grid-cols-1 justify-items-center bg-white h-96 w-full border-4 border-[#EB5E28]/50 rounded-lg p-6 shadow-2xl">
          <img src="../public/imgs/impetus.jpg" alt="NUPL Logo" class="object-cover rounded-lg w-full h-full shadow-2xl" />
          <button class="mt-4 w-full h-12 bg-[#403D39] text-[#FFFCF2] self-end rounded-lg font-semibold text-lg">See Players</button>
      </div>

      <!-- Card 3 -->
      <div class="grid grid-cols-1 justify-items-center bg-white h-96 w-full border-4 border-[#EB5E28]/50 rounded-lg p-6 shadow-2xl">
          <img src="../public/imgs/futsal.jpg" alt="NUPL Logo" class="object-cover rounded-lg w-full h-full shadow-2xl" />
          <button class="mt-4 w-full h-12 bg-[#403D39] text-[#FFFCF2] self-end rounded-lg font-semibold text-lg">See Players</button>
      </div>

      <!-- Card 4 -->
      <div class="grid grid-cols-1 justify-items-center bg-white h-96 w-full border-4 border-[#EB5E28]/50 rounded-lg p-6 shadow-2xl">
          <img src="../public/imgs/kabaddi.jpg" alt="NUPL Logo" class="object-cover rounded-lg w-full h-full shadow-2xl" />
          <button class="mt-4 w-full h-12 bg-[#403D39] text-[#FFFCF2] self-end rounded-lg font-semibold text-lg">See Players</button>
      </div> 
  </div>
</body>
</html>
