name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Environment Template
        run: |
          test -f .env.example || exit 1
          cp .env.example .env

      - name: Syntax & Integrity Checks
        run: npm test

      - name: Validate Core Express Gateway
        run: node -e "const express = require('express'); console.log('Express core loaded successfully');"
